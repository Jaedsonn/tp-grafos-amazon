[project]
name = "tp-grafos-amazon"
version = "0.1.0"
description = "TP de Grafos: projeção jogo–jogo do Amazon Reviews 2018 Video Games"
requires-python = ">=3.11,<3.12"
dependencies = [
    "networkx",
    "python-igraph",
    "numpy",
    "scipy",
    "matplotlib",
    "powerlaw",
]

[dependency-groups]
dev = [
    "black",
    "jupyter>=1.1.1",
    "ipykernel>=7.4.0",
    "nbformat>=5.11.1",
    "nbconvert>=7.17.2",
]

[tool.uv]
package = false

