[project]
name = "tp-grafos-amazon"
version = "0.1.0"
description = "TP de Grafos: projeção jogo–jogo do Amazon Reviews 2018 Video Games"
requires-python = ">=3.11,<3.12"
dependencies = [
    "networkx",
    "python-igraph",
    "numpy",
    "scipy",
    "matplotlib",
    "powerlaw",
]

[dependency-groups]
dev = ["pytest", "black"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests", "src"]
addopts = "--doctest-modules -q"
